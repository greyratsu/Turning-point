name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm init -y # Ensures package.json exists if your repo is plain HTML/CSS
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Configuration
        run: |
          # Generate capacitor.config.json dynamically
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir .

      - name: Add Android Platform & Sync Assets
        run: |
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
